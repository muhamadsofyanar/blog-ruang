ServerName localhost
ServerTokens Prod
ServerSignature Off
<Directory /var/www/html>
    Options -Indexes -ExecCGI +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
<DirectoryMatch "^/var/www/html/(cache|helpers|migrations|config|docker|tests)(/|$)">
    Require all denied
</DirectoryMatch>
<Directory /var/www/html/uploads>
    AllowOverride None
    <FilesMatch "(?i)\.(php[0-9]*|phtml|phar)(\.|$)">
        Require all denied
    </FilesMatch>
</Directory>
<FilesMatch "(?i)^(\..*|Dockerfile|docker-compose\.ya?ml|.*\.(md|sql|sh|ini|zip|log|bak)|bootstrap\.php|helpers\.php|db\.php|requirements\.php|install\.lock)$">
    Require all denied
</FilesMatch>
